# Look of each ReQuisite section in the emailed edition.
# "match" is a lowercase phrase found in the section heading the daily task writes.
# A section whose heading matches nothing uses the first entry (neutral grey, key "other").
# Colors come from the requstudio.com card pastels. band = light section header background,
# bar = card edge and section rule, tint = tag fill, accent = text color for labels and links.
- match: "__default__"
  key: other
  short: More
  accent: "#4A4350"
  tint: "#E9E4EC"
  rule: "#CFC5D3"
  band: "#F2EEF3"
  bar: "#4A4350"
  note: More from today
- match: "ai products"
  key: products
  short: Products
  accent: "#6E3580"
  tint: "#EBD8F0"
  rule: "#D6B8DF"
  band: "#F7EFF9"
  bar: "#914AA1"
  note: New models, tools and launches
- match: "data and"
