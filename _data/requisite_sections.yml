# Look of each ReQuisite section in the emailed edition.
# "match" is a lowercase phrase found in the section heading the daily task writes.
# A section whose heading matches nothing uses the first entry (neutral grey, key "other").
# Colors are the card pastels from requstudio.com: tint = card fill, accent = dark ink for links and labels.
- match: "__default__"
  key: other
  short: More
  accent: "#4A4350"
  tint: "#E9E4EC"
  rule: "#CFC5D3"
  note: More from today
- match: "ai products"
  key: products
  short: Products
  accent: "#6E3580"
  tint: "#EBD8F0"
  rule: "#D6B8DF"
  note: New models, tools and launches
- match: "data and"
  key: data
  short: Data
  accent: "#1F5754"
  tint: "#CDE5E1"
  rule: "#A9D0CA"
  note: Warehouses, pipelines and the analytics stack
- match: "workforce"
  key: workforce
  short: Workforce
  accent: "#8A4B12"
  tint: "#F5DCC0"
  rule: "#E8BF93"
  note: Jobs, skills and how work is changing
- match: "policy"
  key: policy
  short: Policy
  accent: "#2A4D7C"
  tint: "#D9E5F3"
  rule: "#B4CBE4"
  note: Laws, regulators and deadlines
- match: "environmental"
  key: environment
  short: Impacts
  accent: "#38612A"
  tint: "#DDEBD2"
  rule: "#BDD6AC"
  note: Energy, land and communities
- match: "off the beaten"
  key: offbeat
  short: Off the path
  accent: "#A4431F"
  tint: "#F9D9CD"
  rule: "#EDB6A1"
  note: Credible research and reporting outside the headlines
- match: "security"
  key: security
  short: Security
  accent: "#1E1A24"
  tint: "#F2C14E"
  rule: "#D9A92F"
  note: Breaches, vulnerabilities, enforcement and deadlines to act on
