<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
  <meta name="theme-color" content="#1E1A24">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@500;600;700;800&family=Caveat:wght@600;700&family=JetBrains+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="{{ "/assets/css/brief.css" | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="ReQuisite: all editions" href="{{ "/feed.xml" | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="ReQuisite: latest only" href="{{ "/latest.xml" | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="{{ "/" | relative_url }}">
        <span class="brand-mark">ReQu Studio</span>
        <span class="brand-sep" aria-hidden="true"></span>
        <span class="brand-name">ReQuisite</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="{{ "/latest/" | relative_url }}">Latest</a>
        <a href="{{ "/#archive" | relative_url }}">All ReQuisites</a>
        <a href="{{ "/feed.xml" | relative_url }}">RSS</a>
        <a href="{{ site.studio_url }}">ReQu Studio</a>
        <a class="nav-cta" href="#subscribe">Subscribe</a>
      </nav>
    </div>
  </header>
  <main id="main">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="wrap footer-row">
      <p class="footer-brand">ReQu Studio</p>
      <p>Curated by Chelsea Wilson at <a href="{{ site.studio_url }}">ReQu Studio</a>. Every item links to its original source; summaries state only what the source says.</p>
      <p class="feeds"><a href="{{ "/feed.xml" | relative_url }}">RSS: all ReQuisites</a> <span aria-hidden="true">·</span> <a href="{{ "/latest.xml" | relative_url }}">RSS: latest only</a></p>
    </div>
  </footer>
  <script src="{{ "/assets/js/brief.js" | relative_url }}" defer></script>
</body>
</html>
